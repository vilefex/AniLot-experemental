name: Apply staged AniLot web player patch
on:
  push:
    branches: [main]
    paths:
      - '.patch-upload/**'
      - '.github/workflows/apply-anilot-patch.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reassemble and verify patch
        run: |
          set -euo pipefail
          cat .patch-upload/*.b64 | base64 --decode | xz --decompress --stdout > /tmp/anilot-web-player.patch
          echo "f6d110779b10a745b716aae6f9711db15b459be4bee55f5e6f0d2a6e04863864  /tmp/anilot-web-player.patch" | sha256sum --check -
          git apply --check /tmp/anilot-web-player.patch
          git apply /tmp/anilot-web-player.patch
          git diff --stat
      - name: Check Rust formatting
        run: cargo fmt --manifest-path anilot/Cargo.toml --all -- --check
        continue-on-error: true
      - name: Install Rust system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libwayland-dev libxkbcommon-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev libvulkan-dev
        continue-on-error: true
      - name: Run Rust tests
        run: cargo test --manifest-path anilot/Cargo.toml --lib --locked
        continue-on-error: true
      - name: Install web dependencies
        working-directory: web
        run: npm install --no-audit --no-fund --no-package-lock
        continue-on-error: true
      - name: Type-check web app
        working-directory: web
        run: npx next typegen && npx tsc --noEmit
        continue-on-error: true
      - name: Build web app
        working-directory: web
        run: npm run build
        continue-on-error: true
      - name: Commit the patch without temporary upload files
        run: |
          set -euo pipefail
          rm -rf .patch-upload
          rm .github/workflows/apply-anilot-patch.yml
          git reset --soft HEAD^
          git add -A
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Apply AniLot web UI and player refactor"
          git push --force-with-lease origin HEAD:main
